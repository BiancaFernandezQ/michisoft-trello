# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 🎭 Playwright + Trello E2E Hybrid Tests

on:
  push:
    branches: [ main, staging, dev ]
  pull_request:
    branches: [ main, staging, dev ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout del código
        uses: actions/checkout@v4

      - name: 🧰 Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ⚙️ Instalar dependencias
        run: npm ci

      - name: 🎭 Instalar navegadores Playwright
        run: npx playwright install --with-deps

      - name: ✅ Validar secretos Trello requeridos
        run: |
          if [ -z "${{ secrets.TRELLO_KEY }}" ]; then echo "❌ Falta TRELLO_KEY"; exit 1; fi
          if [ -z "${{ secrets.TRELLO_TOKEN }}" ]; then echo "❌ Falta TRELLO_TOKEN"; exit 1; fi
          if [ -z "${{ secrets.TRELLO_MEMBER_ID }}" ]; then echo "❌ Falta TRELLO_MEMBER_ID"; exit 1; fi
          if [ -z "${{ secrets.TRELLO_USER }}" ]; then echo "❌ Falta TRELLO_USER"; exit 1; fi
          if [ -z "${{ secrets.TRELLO_PASSWORD }}" ]; then echo "❌ Falta TRELLO_PASSWORD"; exit 1; fi
          if [ -z "${{ secrets.TRELLO_CARD_ID }}" ]; then echo "❌ Falta TRELLO_CARD_ID"; exit 1; fi
          if [ -z "${{ secrets.TRELLO_NEW_LIST_ID }}" ]; then echo "❌ Falta TRELLO_NEW_LIST_ID"; exit 1; fi

      - name: 🧠 Generar archivo .env temporal con variables
        run: |
          echo "TRELLO_KEY=${{ secrets.TRELLO_KEY }}" >> .env
          echo "TRELLO_TOKEN=${{ secrets.TRELLO_TOKEN }}" >> .env
          echo "TRELLO_MEMBER_ID=${{ secrets.TRELLO_MEMBER_ID }}" >> .env
          echo "TRELLO_USER=${{ secrets.TRELLO_USER }}" >> .env
          echo "TRELLO_PASSWORD=${{ secrets.TRELLO_PASSWORD }}" >> .env
          echo "TRELLO_CARD_ID=${{ secrets.TRELLO_CARD_ID }}" >> .env
          echo "TRELLO_NEW_LIST_ID=${{ secrets.TRELLO_NEW_LIST_ID }}" >> .env
          echo "NODE_ENV=ci" >> .env

      - name: 🧪 Ejecutar todos los tests Playwright (UI + API)
        run: npx playwright test tests/ui tests/api --reporter=html

      - name: 📊 Subir reporte HTML como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
